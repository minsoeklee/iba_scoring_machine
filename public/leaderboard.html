<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>리더보드 — IBA Scoring Machine</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
<main>
  <h1>리더보드</h1>
  <p>팀별 최고 기록. RMSE 오름차순, 같으면 R²가 높은 쪽, 그다음 먼저 제출한 쪽.</p>

  <div class="board-meta">
    <span class="small" id="meta">불러오는 중…</span>
    <button class="ghost" id="refresh" type="button">새로고침</button>
  </div>

  <div class="table-wrap">
    <table id="board">
      <thead>
        <tr><th class="num">#</th><th>팀</th><th>닉네임</th><th class="num">RMSE</th><th class="num">R²</th><th>제출 시각</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <p class="empty" id="empty" hidden>아직 제출이 없습니다. <a href="/submit.html">첫 제출</a>을 해보세요.</p>
</main>

<script>
(function () {
  const tbody = document.querySelector("#board tbody");
  const meta = document.getElementById("meta");
  const empty = document.getElementById("empty");
  const table = document.getElementById("board");
  const btn = document.getElementById("refresh");

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  async function load() {
    btn.disabled = true;
    meta.textContent = "불러오는 중…";
    const r = await window.IBA.api("/api/leaderboard");
    btn.disabled = false;
    if (!r.ok) { meta.textContent = `불러오지 못했습니다 (HTTP ${r.status})`; return; }
    const f = window.IBA.fmt;
    const rows = r.body;
    tbody.innerHTML = rows.map((row) => `
      <tr>
        <td class="num">${row.rank}</td>
        <td>${esc(row.team)}</td>
        <td>${esc(row.nickname)}</td>
        <td class="num">${f.rmse(row.rmse)}</td>
        <td class="num">${f.r2(row.r2)}</td>
        <td class="mono">${f.time(row.submitted_at)}</td>
      </tr>`).join("");
    const hasRows = rows.length > 0;
    table.hidden = !hasRows;
    empty.hidden = hasRows;
    const now = new Date();
    meta.textContent = `${rows.length}팀 · ${f.time(now.toISOString())} 기준`;
  }

  btn.addEventListener("click", load);
  document.addEventListener("DOMContentLoaded", load);
})();
</script>
</body>
</html>
