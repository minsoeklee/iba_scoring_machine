<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IBA — Regression Project Scoring Service</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400..700&family=Playfair+Display:wght@700;900&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/assets/landing.css">
</head>
<body>

<!-- 메뉴 버튼과 사이드바: 버튼과 사이드바를 한 요소로 감싸 커서가 둘 사이를 오갈 때 닫히지 않게 한다.
     hover로 열되 focus-within으로도 열려 키보드만 쓰는 사람도 같은 메뉴에 닿는다. -->
<div class="menu-zone" id="menuZone">
  <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="Open menu">
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>

  <nav class="sidebar" id="sidebar" aria-label="Site menu">
    <a class="side-brand" href="/">IBA</a>

    <ul class="side-nav">
      <li><a href="/"><span>Home</span></a></li>
      <li><a href="/submit.html"><span>Submit</span></a></li>
      <li><a href="/leaderboard.html"><span>Leaderboard</span></a></li>
      <li><a href="/minigame.html"><span>Minigame</span></a></li>
    </ul>

    <div class="side-foot">
      <a href="/login.html"><span>Log in</span></a>
      <a href="/signup.html"><span>Sign up</span></a>
    </div>
  </nav>
</div>

<!-- 오른쪽 위: 메뉴 버튼과 같은 높이에서 마주 보는 두 줄 -->
<nav class="corner-links" aria-label="Quick links">
  <a href="/login.html">Sign in</a>
  <a href="/submit.html#rules">How to use?</a>
</nav>

<!-- 사이드바가 열렸을 때 본문을 아주 살짝 눌러 주는 막 -->
<div class="scrim" id="scrim" aria-hidden="true"></div>

<main class="hero">
  <h1 class="wordmark">IBA</h1>
  <p class="tagline">Regression Project Scoring Service</p>
</main>

<!-- 하단 바: 배경 없이 사이트와 같은 바탕. 줄글 한 덩이 + 한 줄 저작권. -->
<footer class="site-foot">
  <div class="foot-inner">

    <div class="foot-bottom">
      <p class="foot-legal">
        © 2026 PNU IBA
        <span class="sep">·</span>
        <a href="https://pnuiba.imweb.me/" target="_blank" rel="noopener">Webpage</a> |
        <a href="https://www.instagram.com/pnu_iba/" target="_blank" rel="noopener">Instagram</a> |
        <a href="https://linktr.ee/pnuiba" target="_blank" rel="noopener">Linktree</a>
        <span class="sep">·</span>
        The devil&rsquo;s in the details.
      </p>

    </div>
  </div>
</footer>

<script>
(function () {
  const zone = document.getElementById("menuZone");
  const btn = document.getElementById("menuBtn");
  const sidebar = document.getElementById("sidebar");

  // 호버로 열리지만, 클릭하면 고정(핀)되어 커서를 빼도 닫히지 않는다.
  let pinned = false;

  const isOpen = () => pinned || zone.matches(":hover, :focus-within");
  const sync = () => {
    const open = isOpen();
    document.body.classList.toggle("menu-open", open);
    btn.setAttribute("aria-expanded", String(open));
    btn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  };

  zone.addEventListener("pointerenter", sync);
  zone.addEventListener("pointerleave", sync);
  zone.addEventListener("focusin", sync);
  zone.addEventListener("focusout", () => requestAnimationFrame(sync));

  btn.addEventListener("click", () => { pinned = !pinned; sync(); });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    pinned = false;
    btn.blur();
    if (sidebar.contains(document.activeElement)) btn.focus();
    sync();
  });

  document.addEventListener("DOMContentLoaded", sync);
})();
</script>
</body>
</html>
