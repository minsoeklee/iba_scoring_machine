<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>미니게임 — IBA Scoring Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400..700&display=swap">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/icons.js" defer></script>
  <script src="/assets/app.js" defer></script>
</head>
<body>
<main>
<section class="card">
  <div class="card-head"><h2>미니게임</h2></div>
  <p class="lead">채점·리더보드와는 무관한 쉬어 가는 게임입니다. 최고 기록은 이 브라우저에만 저장됩니다.</p>
</section>

<div class="game-list">
  <a class="game-card" href="/games/price.html">
    <div class="thumb">
      <svg viewBox="0 0 120 76" aria-hidden="true">
        <rect x="14" y="30" width="92" height="26" rx="8" fill="#3ec7e0"/>
        <path d="M30 30 L42 14 H78 L92 30 Z" fill="#4f7df0"/>
        <circle cx="36" cy="58" r="9" fill="#e8eefc"/><circle cx="84" cy="58" r="9" fill="#e8eefc"/>
        <text x="60" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1a2e">£ ?</text>
      </svg>
    </div>
    <div class="body">
      <span class="title">가격 감 테스트</span>
      <span class="desc">train.csv의 중고차 10대를 보고 가격을 맞혀 내 RMSE를 확인합니다.</span>
      <span class="meta">10대 · 약 3분</span>
    </div>
  </a>

  <a class="game-card" href="/games/tetris.html">
    <div class="thumb">
      <svg viewBox="0 0 120 76" aria-hidden="true">
        <g stroke="#0b1a2e" stroke-width="2">
          <rect x="24" y="52" width="16" height="16" fill="#4f7df0"/><rect x="40" y="52" width="16" height="16" fill="#4f7df0"/><rect x="56" y="52" width="16" height="16" fill="#4f7df0"/><rect x="24" y="36" width="16" height="16" fill="#4f7df0"/>
          <rect x="72" y="52" width="16" height="16" fill="#f2c94c"/><rect x="88" y="52" width="16" height="16" fill="#f2c94c"/><rect x="72" y="36" width="16" height="16" fill="#f2c94c"/><rect x="88" y="36" width="16" height="16" fill="#f2c94c"/>
          <rect x="48" y="4" width="16" height="16" fill="#a77bf3"/><rect x="32" y="20" width="16" height="16" fill="#a77bf3"/><rect x="48" y="20" width="16" height="16" fill="#a77bf3"/><rect x="64" y="20" width="16" height="16" fill="#a77bf3"/>
        </g>
      </svg>
    </div>
    <div class="body">
      <span class="title">테트리스</span>
      <span class="desc">떨어지는 블록을 돌리고 쌓아 줄을 없앱니다. 10줄마다 빨라집니다.</span>
      <span class="meta" data-best="iba.best.tetris">키보드</span>
    </div>
  </a>

  <a class="game-card" href="/games/blocks.html">
    <div class="thumb">
      <svg viewBox="0 0 120 76" aria-hidden="true">
        <g>
          <rect x="8" y="6" width="20" height="8" rx="2" fill="#ef6b6b"/><rect x="31" y="6" width="20" height="8" rx="2" fill="#ef6b6b"/><rect x="54" y="6" width="20" height="8" rx="2" fill="#ef6b6b"/><rect x="77" y="6" width="20" height="8" rx="2" fill="#ef6b6b"/><rect x="100" y="6" width="12" height="8" rx="2" fill="#ef6b6b"/>
          <rect x="8" y="17" width="20" height="8" rx="2" fill="#f2c94c"/><rect x="54" y="17" width="20" height="8" rx="2" fill="#f2c94c"/><rect x="77" y="17" width="20" height="8" rx="2" fill="#f2c94c"/>
          <rect x="31" y="28" width="20" height="8" rx="2" fill="#3ec7e0"/><rect x="77" y="28" width="20" height="8" rx="2" fill="#3ec7e0"/><rect x="100" y="28" width="12" height="8" rx="2" fill="#3ec7e0"/>
        </g>
        <circle cx="58" cy="50" r="4" fill="#fff"/>
        <rect x="42" y="64" width="34" height="6" rx="3" fill="#e8eefc"/>
      </svg>
    </div>
    <div class="body">
      <span class="title">블록깨기</span>
      <span class="desc">패들로 공을 튕겨 블록을 모두 깹니다. 스테이지마다 공이 빨라집니다.</span>
      <span class="meta" data-best="iba.best.blocks">마우스 · 키보드</span>
    </div>
  </a>
</div>
</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("[data-best]").forEach((el) => {
    let best = 0;
    try { best = Number(localStorage.getItem(el.dataset.best)) || 0; } catch (_) {}
    if (best > 0) el.textContent += ` · 최고 기록 ${best.toLocaleString("ko-KR")}점`;
  });
});
</script>
</body>
</html>
