<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>미니게임 — IBA Scoring Machine</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
  <script src="/assets/minigame-data.js"></script>
</head>
<body>
<main>
  <h1>가격 감 테스트</h1>
  <p>train.csv에서 뽑은 중고차 한 대의 정보를 보고 가격(파운드)을 맞혀 보세요. 10대를 맞히면 당신의 RMSE가 나옵니다. 채점·리더보드와는 무관한 장난감입니다.</p>

  <div class="game-stats">
    <div><div class="label">진행</div><div class="value" id="progress">0 / 10</div></div>
    <div><div class="label">내 RMSE</div><div class="value" id="myRmse">–</div></div>
    <div><div class="label">최근 오차</div><div class="value" id="lastErr">–</div></div>
  </div>

  <section class="car" id="car"></section>

  <form class="guess-row" id="guessForm">
    <label>내 예상 가격 (£)
      <input type="number" id="guess" min="0" step="1" inputmode="numeric" autocomplete="off" required>
    </label>
    <button type="submit" class="primary" id="guessBtn">제출</button>
    <button type="button" class="ghost" id="restart" hidden>다시 하기</button>
  </form>

  <section id="summary" class="result" hidden></section>

  <h2>기록</h2>
  <div class="table-wrap">
    <table class="game-log">
      <thead><tr><th>#</th><th>차량</th><th class="num">내 예상</th><th class="num">실제</th><th class="num">오차</th></tr></thead>
      <tbody id="log"></tbody>
    </table>
  </div>
</main>

<script>
(function () {
  const ROUNDS = 10;
  const data = window.CAR_SAMPLE || [];
  const carEl = document.getElementById("car");
  const form = document.getElementById("guessForm");
  const guessEl = document.getElementById("guess");
  const guessBtn = document.getElementById("guessBtn");
  const restartBtn = document.getElementById("restart");
  const logEl = document.getElementById("log");
  const summaryEl = document.getElementById("summary");
  const progressEl = document.getElementById("progress");
  const myRmseEl = document.getElementById("myRmse");
  const lastErrEl = document.getElementById("lastErr");

  const fuelKo = { Petrol: "휘발유", Diesel: "경유", Hybrid: "하이브리드", Electric: "전기", Other: "기타" };
  const brandKo = { audi: "Audi", bmw: "BMW", merc: "Mercedes", vw: "Volkswagen", ford: "Ford", toyota: "Toyota", hyundi: "Hyundai", skoda: "Skoda", vauxhall: "Vauxhall", focus: "Ford Focus", cclass: "Mercedes C-Class" };

  let deck = [], round = 0, sqErrSum = 0;
  const int = (v) => v.toLocaleString("ko-KR");

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function title(c) { return `${brandKo[c.brand] || c.brand} ${c.model}`; }

  function renderCar(c) {
    carEl.innerHTML = `
      <p class="title">${title(c)} <span class="small">(${c.year})</span></p>
      <dl class="facts">
        <dt>주행거리</dt><dd>${int(c.mileage)} mi</dd>
        <dt>연료</dt><dd>${fuelKo[c.fuelType] || c.fuelType}</dd>
        <dt>변속기</dt><dd>${c.transmission}</dd>
        <dt>배기량</dt><dd>${c.engineSize.toFixed(1)} L</dd>
        <dt>연비</dt><dd>${c.mpg} mpg</dd>
      </dl>`;
  }

  function start() {
    deck = shuffle(data.slice()).slice(0, ROUNDS);
    round = 0; sqErrSum = 0;
    logEl.innerHTML = ""; summaryEl.hidden = true; restartBtn.hidden = true;
    guessEl.disabled = false; guessBtn.disabled = false; guessEl.value = "";
    myRmseEl.textContent = "–"; lastErrEl.textContent = "–";
    progressEl.textContent = `0 / ${ROUNDS}`;
    renderCar(deck[0]);
    guessEl.focus();
  }

  function finish() {
    const rmse = Math.sqrt(sqErrSum / ROUNDS);
    let verdict;
    if (rmse < 2500) verdict = "딜러급. 모델보다 정확할지도.";
    else if (rmse < 4500) verdict = "괜찮은 감. 베이스라인 DecisionTree는 이 정도 나옵니다.";
    else if (rmse < 8000) verdict = "평균적. 주행거리와 연식을 더 보세요.";
    else if (rmse < 13190) verdict = "sample_submission(무작위 값, 13,190)보다는 낫습니다.";
    else verdict = "무작위 값(sample_submission, 13,190)보다 못했습니다. 연식·주행거리부터 다시 보세요.";
    summaryEl.hidden = false;
    summaryEl.innerHTML = `<p><strong>10대 완료</strong></p><div class="score"><div><div class="label">내 RMSE</div><div class="value">${rmse.toLocaleString("ko-KR", { maximumFractionDigits: 0 })}</div></div></div><p>${verdict}</p>`;
    guessEl.disabled = true; guessBtn.disabled = true; restartBtn.hidden = false;
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (round >= ROUNDS) return;
    const guess = Number(guessEl.value);
    if (!Number.isFinite(guess) || guess < 0) return;
    const c = deck[round];
    const err = guess - c.price;
    sqErrSum += err * err;
    round += 1;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${round}</td><td>${title(c)} (${c.year})</td><td class="num">${int(guess)}</td><td class="num">${int(c.price)}</td><td class="num">${err > 0 ? "+" : ""}${int(err)}</td>`;
    logEl.prepend(tr);
    progressEl.textContent = `${round} / ${ROUNDS}`;
    myRmseEl.textContent = Math.sqrt(sqErrSum / round).toLocaleString("ko-KR", { maximumFractionDigits: 0 });
    lastErrEl.textContent = `${err > 0 ? "+" : ""}${int(err)}`;
    guessEl.value = "";
    if (round >= ROUNDS) finish(); else { renderCar(deck[round]); guessEl.focus(); }
  });

  restartBtn.addEventListener("click", start);
  document.addEventListener("DOMContentLoaded", () => {
    if (data.length < ROUNDS) { carEl.textContent = "데이터를 불러오지 못했습니다."; return; }
    start();
  });
})();
</script>
</body>
</html>
