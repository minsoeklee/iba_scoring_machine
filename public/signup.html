<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 — IBA Scoring Machine</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400..700&display=swap">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/icons.js" defer></script>
  <script src="/assets/app.js" defer></script>
</head>
<body>
<main>
<section class="card auth-card">
  <h1>회원가입</h1>
  <p class="lead">같은 팀명으로 가입한 사람끼리 한 팀이 되고, 하루 제출 3회를 함께 씁니다.</p>
  <form class="stack" id="form" novalidate>
    <label>아이디
      <input type="text" name="username" maxlength="20" autocomplete="username" autocapitalize="off" required>
      <span class="hint">영문 소문자·숫자·밑줄(_), 4~20자</span>
    </label>
    <label>비밀번호
      <input type="password" name="password" maxlength="72" autocomplete="new-password" required>
      <span class="hint">8자 이상</span>
    </label>
    <label>닉네임
      <input type="text" name="nickname" maxlength="40" autocomplete="off" required>
      <span class="hint">리더보드에 제출자로 표시됩니다.</span>
    </label>
    <label>팀명
      <input type="text" name="team" maxlength="40" autocomplete="off" required>
      <span class="hint">공백·대소문자는 무시됩니다. 팀원과 같은 팀명을 입력하세요. 가입 후에는 바꿀 수 없습니다.</span>
    </label>
    <p class="msg-error" id="error" hidden></p>
    <button type="submit" class="primary block" id="submitBtn">가입하기</button>
  </form>
  <p class="switch">이미 계정이 있나요? <a id="toLogin" href="/login.html">로그인</a></p>
</section>
</main>

<script>
(function () {
  const form = document.getElementById("form");
  const errorEl = document.getElementById("error");
  const btn = document.getElementById("submitBtn");

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("toLogin").href = "/login.html" + location.search;
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = {
      username: form.username.value, password: form.password.value,
      nickname: form.nickname.value, team: form.team.value,
    };
    btn.disabled = true;
    errorEl.hidden = true;
    const r = await window.IBA.api("/api/signup", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    btn.disabled = false;
    if (r.ok) { location.href = window.IBA.nextPath(); return; }
    errorEl.textContent = (r.body && r.body.message) || `가입하지 못했습니다 (HTTP ${r.status})`;
    errorEl.hidden = false;
  });
})();
</script>
</body>
</html>
