<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>감사한 분들 — IBA Scoring Machine</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400..700&family=Playfair+Display:wght@700;900&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/assets/chrome.css">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/icons.js" defer></script>
  <script src="/assets/app.js" defer></script>
  <script src="/assets/chrome.js" defer></script>
</head>
<body>
<main>
<section class="card">
  <p class="lead">
    10기 집행부에게 고맙습니다. 회귀 프로젝트를 기획하고 데이터를 준비하고 기수를 굴려 온 사람들이고,
    이 사이트는 그 위에 얹은 도구일 뿐입니다.
  </p>
</section>

<!-- TODO: 10기 집행부 명단을 채워 주세요. 한 사람당 아래 <li> 한 덩이입니다.
     직책과 이름, 한 줄 소개(생략 가능)를 적으면 됩니다. -->
<section class="card">
  <div class="card-head"><h2>10기 집행부</h2></div>
  <ul class="crew">
    <li>
      <span class="role">회장</span>
      <span class="name">이름</span>
      <span class="note">한 줄 소개를 적어 주세요.</span>
    </li>
    <li>
      <span class="role">부회장</span>
      <span class="name">이름</span>
      <span class="note">한 줄 소개를 적어 주세요.</span>
    </li>
    <li>
      <span class="role">총무</span>
      <span class="name">이름</span>
      <span class="note">한 줄 소개를 적어 주세요.</span>
    </li>
  </ul>
  <div class="card-foot">직책과 인원은 기수마다 다릅니다. 명단이 바뀌면 이 목록만 고치면 됩니다.</div>
</section>
</main>
</body>
</html>
