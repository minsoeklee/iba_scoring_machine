<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사과게임 — IBA Scoring Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400..700&display=swap">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/icons.js" defer></script>
  <script src="/assets/app.js" defer></script>
  <script src="/games/apple.js" defer></script>
</head>
<body>
<main>
<p class="desktop-only-note">마우스로 하는 게임입니다. PC에서 즐겨 주세요.</p>
<section class="card">
  <div class="card-head">
    <h2>사과게임</h2>
    <a class="more" href="/minigame.html">미니게임 목록<i data-icon="arrow-right"></i></a>
  </div>
  <div class="game-layout">
    <div>
      <div class="game-stage">
        <canvas id="board" width="674" height="408" aria-label="사과게임 판"></canvas>
        <div class="game-overlay" id="overlay" hidden></div>
      </div>
      <div class="bar time-bar"><i id="timeBar"></i></div>
    </div>
    <div class="game-side">
      <div class="game-stats">
        <div><div class="label">없앤 사과</div><div class="value" id="score">0</div></div>
        <div><div class="label">최고 기록</div><div class="value" id="best">0</div></div>
        <div><div class="label">남은 시간</div><div class="value" id="time">120초</div></div>
      </div>
      <dl class="keys">
        <dt>드래그</dt><dd>사각형 그리기</dd>
      </dl>
      <p class="small">사각형 안 사과의 숫자 합이 정확히 10이면 사과가 사라집니다. 사각형 테두리가 초록색이면 합이 10입니다.</p>
      <button type="button" id="restart">처음부터 다시</button>
    </div>
  </div>
</section>

<section class="card flush">
  <div class="card-head"><h2>팀 순위</h2></div>
  <div class="table-wrap">
    <table id="gameBoard" hidden>
      <thead><tr><th>순위</th><th>팀</th><th class="num">점수</th><th class="num">기록 시각</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <p class="empty" id="gameBoardEmpty">불러오는 중…</p>
  <div class="card-foot">팀별 최고 점수입니다. 로그인한 상태로 게임을 마치면 우리 팀 기록으로 올라갑니다.</div>
</section>
</main>
</body>
</html>
